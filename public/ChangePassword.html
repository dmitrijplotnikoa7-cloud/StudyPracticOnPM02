<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Смена пароля — Restro'Heaven</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <header class="sticky-nav">
    <div class="container nav-container">
      <h1 class="logo">Restro'Heaven</h1>
    </div>
  </header>

  <main class="login-page">
    <div class="login-card">
      <h2>Смена пароля</h2>

      <form id="request-form" class="auth-form">
        <p class="step-hint">Шаг 1. Укажите email — пришлём временный пароль.</p>
        <input type="email" id="req-email" placeholder="Email" required />
        <p class="auth-error" id="req-error"></p>
        <p class="auth-ok" id="req-ok"></p>
        <button type="submit" class="auth-btn">Отправить временный пароль</button>
      </form>

      <hr class="auth-divider" />

      <form id="change-form" class="auth-form">
        <p class="step-hint">Шаг 2. Введите временный пароль из письма и новый.</p>
        <input type="email"    id="ch-email"    placeholder="Email" required />
        <input type="text"     id="ch-temp"     placeholder="Временный пароль" required />
        <input type="password" id="ch-new"      placeholder="Новый пароль" required />
        <input type="password" id="ch-confirm"  placeholder="Повторите новый пароль" required />
        <p class="auth-error" id="ch-error"></p>
        <p class="auth-ok" id="ch-ok"></p>
        <button type="submit" class="auth-btn">Сменить пароль</button>
      </form>

      <p class="auth-back"><a href="/login.html">← Вернуться к входу</a></p>
    </div>
  </main>

  <script src="changePassword.js"></script>
</body>
</html>
